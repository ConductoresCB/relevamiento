<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tablero del Relevamiento</title>
<meta name="description" content="Tablero de análisis del Relevamiento Corredor Bioceánico (Jujuy): carga de planillas, filtros, cruces y gráficos.">
<link rel="icon" href="../icons/icono-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="css/tablero.css">
</head>
<body>
<div class="marco">
  <aside class="lateral">
    <div class="marca-proyecto">
      <span class="ceja">Relevamiento</span>
      <strong>Corredor Bioceánico · Jujuy</strong>
      <span class="sub" style="font-size:13px;color:var(--tinta-2)">Tablero de análisis</span>
    </div>
    <nav class="nav" aria-label="Vistas del tablero">
      <button type="button" data-vista="resumen"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Resumen</button>
      <button type="button" data-vista="explorar"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Explorar</button>
      <button type="button" data-vista="cruces"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 3v18"/></svg>Cruces</button>
      <button type="button" data-vista="relaciones"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><circle cx="8" cy="15" r="1.5"/><circle cx="12" cy="11" r="1.5"/><circle cx="17" cy="7" r="1.5"/><circle cx="15" cy="13" r="1.5"/></svg>Relaciones</button>
      <button type="button" data-vista="participantes"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.8c1.6.8 2.6 2.5 3 5.2"/></svg>Participantes</button>
      <button type="button" data-vista="informe"><svg viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>Informe</button>
      <button type="button" data-vista="fuentes"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>Fuentes</button>
    </nav>
    <div class="fuentes-mini" id="fuentes-mini"></div>
  </aside>
  <main class="principal">
    <header class="cabecera">
      <div>
        <h1><span id="titulo-vista">Resumen</span> <span id="pildora-datos"></span></h1>
        <p class="bajada" id="bajada-vista"></p>
      </div>
      <div class="acciones-cab">
        <label class="btn sec"><input type="file" id="archivo" accept=".xlsx,.csv,.txt" multiple hidden>Cargar planillas</label>
        <a class="btn sec" href="../">Ir a la app de campo</a>
      </div>
    </header>
    <section class="filtros" id="filtros" aria-label="Filtros"></section>
    <div id="vista"></div>
  </main>
</div>
<div id="globo" role="tooltip" hidden></div>
<div id="aviso" role="status" hidden></div>

<script src="lib/jszip.min.js"></script>
<script src="../js/cuestionario.js"></script>
<script src="../js/calculos.js"></script>
<script src="js/estadistica.js"></script>
<script src="js/datos.js"></script>
<script src="js/graficos.js"></script>
<script src="js/ejemplo.js"></script>
<script src="js/tablero.js"></script>
</body>
</html>
